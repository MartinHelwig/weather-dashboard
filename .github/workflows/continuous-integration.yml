name: Continuous Integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create a release (e.g. v1.0.0)
        required: false
        type: string
        default: ""
      create-release:
        type: boolean
        description: Create a release version
  push:
    branches: ["main"]
    paths-ignore:
      - ".gitignore"
      - "*.md"
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check-reuse:
    name: Reuse Compliance Check
    permissions:
      contents: read
      packages: none
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      PROJECT_REPOSITORY: ${{ github.repository }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set Project Name
        run: |
          echo "# <a href='${PAGES_URL}'><img src='https://raw.githubusercontent.com/${PROJECT_REPOSITORY}/refs/heads/main/www/images/favicon-48x48.png' align='left'></a> Project ${PROJECT_NAME} on ${BRANCH_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check REUSE
        run: |
          echo "pip install reuse" > install.sh && chmod +x install.sh && ./install.sh && rm install.sh
          echo "## REUSE Compliance" >> "$GITHUB_STEP_SUMMARY"
          echo "For more information about REUSE see [official page](https://reuse.software/)."
          reuse lint | sed 's/# /### /g' >> "$GITHUB_STEP_SUMMARY"
          reuse lint --quiet

  execute-tests:
    if: ${{ always() }}
    needs: [check-reuse]
    name: Unit Test
    permissions:
      contents: read
      packages: none
      checks: write
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts

      - name: Running Tests
        shell: bash
        run: tools/test.sh

      - name: Add Headline Job Summary
        run: echo "## Unit Tests" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Test Report
        if: success() || failure() # always run even if the previous step fails
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: build/tests/junit-report.xml
          detailed_summary: true
          include_passed: true
          fail_on_failure: true
          require_tests: true
          check_name: "Unit Report"

      - name: JaCoCo Code Coverage Report
        id: jacoco_reporter
        uses: PavanMudigonda/jacoco-reporter@112997f0c32da82d8bfa4a972b4afe67a15529fe # v5.2.1
        with:
          coverage_results_path: build/tests/jacoco.xml
          coverage_report_name: Coverage
          coverage_report_title: ${{ env.PROJECT_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 80
          fail_below_threshold: false
          publish_only_summary: false

      - name: Add Coverage Job Summary
        env:
          COVERAGE_PERCENTAGE: ${{ steps.jacoco_reporter.outputs.coveragePercentageString }}
        run: printf '## Code Coverage %s\n' "$COVERAGE_PERCENTAGE" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [execute-tests]
    name: Build Project
    permissions:
      contents: write
      packages: write
      checks: write
      actions: none
      deployments: none
      id-token: write
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
      attestations: write
      artifact-metadata: write

    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare Environment (Global)
        run: |
          echo "preparing global environment"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate Product Version
        env:
          PRODUCT_VERSION: ${{ inputs.version || github.sha }}
        run: |
          sed -i "s/product_version: \"[^\"]*\"/product_version: \"${PRODUCT_VERSION}\"/" www/js/texts.js

      - name: Create Artifact
        env:
          FILENAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p build
          tar cvfz "build/${FILENAME}.tar.gz" -C www .

      - name: Upload Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}
          path: build/${{ github.event.repository.name }}.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload Release Artifact (tar.gz)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create-release == true && inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ inputs.version }}
          RELEASE_ARTIFACT: build/${{ github.event.repository.name }}.tar.gz
        run: |
          # Remove a leading 'v' if present (e.g., v1.2.3 -> 1.2.3)
          CLEAN_VERSION="${PRODUCT_VERSION#v}"

          # Official SemVer regex pattern
          SEMVER_REGEX="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$"

          echo "Checking version: $PRODUCT_VERSION (Cleaned: $CLEAN_VERSION)"

          if [[ "$CLEAN_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "Version matches the SemVer schema."
          else
            echo "ERROR: '$PRODUCT_VERSION' is NOT a valid SemVer format!"
            exit 1
          fi

          if gh release view "$PRODUCT_VERSION" >/dev/null 2>&1 || git rev-parse "$PRODUCT_VERSION" >/dev/null 2>&1; then
            echo "ERROR: the release '$PRODUCT_VERSION' already exists"
            exit 1
          fi

          gh release create "$PRODUCT_VERSION" "$RELEASE_ARTIFACT" --title "$PRODUCT_VERSION" --generate-notes

      - name: Generate Artifact Attestation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create-release == true && inputs.version != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/${{ github.event.repository.name }}.tar.gz

  build-docker:
    needs: [execute-tests]
    name: Build Docker
    permissions:
      contents: read
      packages: write
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none

    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare Environment (Global)
        run: |
          echo "preparing global environment"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate Product Version
        env:
          PRODUCT_VERSION: ${{ inputs.version || github.sha }}
        run: |
          sed -i "s/product_version: \"[^\"]*\"/product_version: \"${PRODUCT_VERSION}\"/" www/js/texts.js

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/Publish Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create-release == true && inputs.version != '' }}
    needs: [build, build-docker]
    name: Deploy Website
    permissions:
      contents: read
      packages: none
      checks: none
      actions: none
      deployments: none
      id-token: write
      issues: none
      discussions: none
      pages: write
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Generate Product Version
        env:
          PRODUCT_VERSION: ${{ inputs.version || github.sha }}
        run: |
          sed -i "s/product_version: \"[^\"]*\"/product_version: \"${PRODUCT_VERSION}\"/" www/js/texts.js

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload www directory
          path: "www"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  generate-authors-summary:
    if: ${{ always() }}
    needs: [build]
    name: Generate Authors Summary
    permissions:
      contents: read
      packages: none
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: "0" # to get the authors summary

      - name: Add Authors Summary
        run: |
          echo "## Authors Summary" >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sce --all >> "$GITHUB_STEP_SUMMARY"
