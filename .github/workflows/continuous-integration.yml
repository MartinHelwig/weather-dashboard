name: Continuous Integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create a release (e.g. v1.0.0)
        required: false
        type: string
        default: ""
      create-release:
        type: boolean
        description: Create a release version
  push:
    branches: ["main"]
    paths-ignore:
      - ".gitignore"
      - "*.md"
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check-reuse:
    name: Reuse Compliance Check
    permissions:
      contents: read
      packages: none
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      PROJECT_REPOSITORY: ${{ github.repository }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set Project Name
        run: |
          echo "# <a href='${PAGES_URL}'><img src='https://raw.githubusercontent.com/${PROJECT_REPOSITORY}/refs/heads/main/www/images/favicon-48x48.png' align='left'></a> Project ${PROJECT_NAME} on ${BRANCH_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check REUSE
        run: |
          echo "pip install reuse" > install.sh && chmod +x install.sh && ./install.sh && rm install.sh
          echo "## REUSE Compliance" >> "$GITHUB_STEP_SUMMARY"
          echo "For more information about REUSE see [official page](https://reuse.software/)."
          reuse lint | sed 's/# /### /g' >> "$GITHUB_STEP_SUMMARY"
          reuse lint --quiet

  execute-tests:
    if: ${{ always() }}
    needs: [check-reuse]
    name: JUnit Test
    permissions:
      contents: read
      packages: none
      checks: write
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts

      - name: Running Tests
        shell: bash
        run: tools/test.sh

      - name: Add Headline Job Summary
        run: echo "## JUnit " >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Test Report
        if: success() || failure() # always run even if the previous step fails
        uses: mikepenz/action-junit-report@a427a90771729d8f85b6ab0cdaa1a5929cab985d # v5
        with:
          report_paths: build/tests/junit-report.xml
          detailed_summary: true
          include_passed: true
          fail_on_failure: true
          require_tests: true
          check_name: "JUnit Report"

      - name: JaCoCo Code Coverage Report
        id: jacoco_reporter
        uses: PavanMudigonda/jacoco-reporter@4fc6bf270fe893e8dda5467e432253a6961345b8 # v5.0
        with:
          coverage_results_path: build/tests/jacoco.xml
          coverage_report_name: Coverage
          coverage_report_title: ${{ env.PROJECT_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 80
          fail_below_threshold: false
          publish_only_summary: false

      - name: Add Coverage Job Summary
        env:
          COVERAGE_PERCENTAGE: ${{ steps.jacoco_reporter.outputs.coveragePercentageString }}
        run: printf '## Code Coverage %s\n' "$COVERAGE_PERCENTAGE" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [execute-tests]
    name: Build Project
    permissions:
      contents: write
      packages: write
      checks: write
      actions: none
      deployments: none
      id-token: write
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
      attestations: write
      artifact-metadata: write

    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare Environment (Global)
        run: |
          echo "preparing global environment"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate Product Version
        env:
          PRODUCT_VERSION: ${{ inputs.version || github.sha }}
        run: |
          sed -i "s/product_version: \"[^\"]*\"/product_version: \"${PRODUCT_VERSION}\"/" www/js/texts.js

      - name: Create Artifact
        env:
          FILENAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p build
          tar cvfz "build/${FILENAME}.tar.gz" -C www .

      - name: Upload Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}
          path: build/${{ github.event.repository.name }}.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload Release Artifact (tar.gz)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create-release == true && inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_ARTIFACT: build/${{ github.event.repository.name }}.tar.gz
        run: |
          # Remove a leading 'v' if present (e.g., v1.2.3 -> 1.2.3)
          CLEAN_VERSION=$(echo "$PRODUCT_VERSION" | sed 's/^v//')

          # Official SemVer regex pattern
          SEMVER_REGEX="^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"

          echo "Checking version: $PRODUCT_VERSION (Cleaned: $CLEAN_VERSION)"

          if [[ "$CLEAN_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "Version matches the SemVer schema."
          else
            echo "ERROR: '$PRODUCT_VERSION' is NOT a valid SemVer format!"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 || git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "ERROR: the release '$RELEASE_TAG' already exists"
            exit 1
          fi

          gh release create "$RELEASE_TAG" "$RELEASE_ARTIFACT" --title "Release $RELEASE_TAG" --generate-notes
          gh release upload "${RELEASE_TAG}" "${RELEASE_ARTIFACT}"

      - name: Generate Artifact Attestation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create-release == true && inputs.version != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/${{ github.event.repository.name }}.tar.gz

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create-release == true && inputs.version != '' }}
    needs: [build]
    name: Deploy Website
    permissions:
      contents: read
      packages: write
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: write
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Generate Product Version
        env:
          PRODUCT_VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          sed -i "s/product_version: \"[^\"]*\"/product_version: \"${PRODUCT_VERSION}\"/" www/js/texts.js

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload www directory
          path: "www"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  generate-authors-summary:
    if: ${{ always() }}
    needs: [build]
    name: Generate Authors Summary
    permissions:
      contents: read
      packages: none
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: "0" # to get the authors summary

      - name: Add Authors Summary
        run: |
          echo "## Authors Summary" >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sce --all >> "$GITHUB_STEP_SUMMARY"
