name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - ".gitignore"
      - "*.md"
  pull_request:
    types: [opened, reopened, synchronize]
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check-reuse:
    name: Reuse Compliance Check
    permissions:
      contents: read
      packages: none
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set Project Name
        run: |
          echo "# <a href='url'><img src='https://raw.githubusercontent.com/${PROJECT_URL}/www/images/favicon-128x128.png' align='left' height='48' width='48'></a> Project ${PROJECT_NAME} on ${BRANCH_NAME}" >> $GITHUB_STEP_SUMMARY

      - name: Check REUSE
        run: |
          echo "pip install reuse" > install.sh && chmod +x install.sh && ./install.sh && rm install.sh
          echo "## REUSE Compliance" >> $GITHUB_STEP_SUMMARY
          echo "For more information about REUSE see [official page](https://reuse.software/)."
          reuse lint | sed  s'/# /### /g' >> $GITHUB_STEP_SUMMARY
          reuse lint --quiet

  execute-tests:
    if: ${{ always() }}
    needs: [check-reuse]
    name: JUnit Test
    permissions:
      contents: read
      packages: none
      checks: write
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: lts

      - name: Running Tests
        shell: bash
        run: tools/test.sh

      - name: Add Headline Job Summary
        run: echo "## JUnit " >> $GITHUB_STEP_SUMMARY

      - name: Publish Test Report
        if: success() || failure() # always run even if the previous step fails
        uses: mikepenz/action-junit-report@a427a90771729d8f85b6ab0cdaa1a5929cab985d # v5
        with:
          report_paths: build/tests/junit-report.xml
          detailed_summary: true
          include_passed: true
          fail_on_failure: true
          require_tests: true
          check_name: "JUnit Report"

      - name: JaCoCo Code Coverage Report
        id: jacoco_reporter
        uses: PavanMudigonda/jacoco-reporter@4fc6bf270fe893e8dda5467e432253a6961345b8 # v5.0
        with:
          coverage_results_path: target/reports/jacoco/jacoco.xml
          coverage_report_name: Coverage
          coverage_report_title: ${{ env.PROJECT_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 80
          fail_below_threshold: false
          publish_only_summary: false

      - name: Add Coverage Job Summary
        run: echo "## Code Coverage ${{ env.coveragePercentageString }}" >> $GITHUB_STEP_SUMMARY

  build:
    needs: [execute-tests]
    name: Build Project
    permissions:
      contents: write
      packages: write
      checks: write
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare Environment (Global)
        run: |
          echo "preparing global environment"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare Release Version
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        shell: bash
        run: ${{ env.COMMAND_MAVEN }} versions:set -DremoveSnapshot=true
        env:
          COMMAND_MAVEN: "${{ runner.os == 'Linux' && 'xvfb-run mvn' || 'mvn' }} ${{ env.GLOBAL_MAVEN_ARGS }}"

      - name: Create Artifact
        id: create_artifact
        run: |
          FILENAME=weather-dashboard.tar.gz
          tar cvfz build/${FILENAME} www/**
          echo "targz_filename=$(basename ${FILENAME})" >> $GITHUB_OUTPUT

      - name: Signing Artifacts
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          gpg --pinentry-mode loopback --batch --passphrase ${{ secrets.GPG_SIGNING_PASSPHRASE }} --armor --detach-sign target/${{ steps.create_artifact.outputs.targz_filename }}

      - name: Upload Release Artifact (tar.gz)
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build/${{ steps.create_artifact.outputs.targz_filename }}
          asset_name: ${{ steps.create_artifact.outputs.targz_filename }}
          asset_content_type: application/gzip

      - name: Upload Release Artifact (tar.gz) Signature
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build/${{ steps.create_artifact.outputs.targz_filename }}.asc
          asset_name: ${{ steps.create_artifact.outputs.targz_filename }}.asc
          asset_content_type: application/octet-stream

  deploy:
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    needs: [build]
    name: Deploy Website
    permissions:
      contents: read
      packages: write
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: write
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload www directory
          path: "www"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  generate-authors-summary:
    if: ${{ always() }}
    needs: [build]
    name: Generate Authors Summary
    permissions:
      contents: read
      packages: none
      checks: none
      actions: none
      deployments: none
      id-token: none
      issues: none
      discussions: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: "0" # to get the authors summary

      - name: Add Authors Summary
        run: |
          echo "## Authors Summary" >> $GITHUB_STEP_SUMMARY
          git shortlog -sce --all >> $GITHUB_STEP_SUMMARY
